# Nav2 for the REAL Go2 (real_navigation.launch.py). Generated from the sim's tested
# unitree_go2_navigation/config/nav2_params.yaml (unchanged there) with these changes only:
#   use_sim_time false everywhere (PC clock; real_tf_bridge restamps the robot's data)
#   amcl: laser_max_range 15 (= our /scan range_max); the start pose is set by real_navigation.launch.py (initial_x/y/yaw,
#     default 0 0 0), then corrected in RViz (2D Pose Estimate)
#   bt_navigator / velocity_smoother odom_topic /go2/odom (the bridge's corrected odometry; Point-LIO with lio:=true)
#   collision_monitor cmd_vel_out_topic /go2/nav2_cmd_vel: NOTHING subscribes to it. Nav2 plans and computes
#     velocities, but no command reaches the robot until a separate, explicitly started bridge exists.
#   global costmap: the sim-only /unmapped_obstacles source removed
#   docking_server, route_server, loopback_simulator sections removed (not started)
#   amcl: alpha1-5 0.02 (sim 0.1-0.2), update_min_d / update_min_a 0.05 (0.1), sigma_hit 0.10 (0.15): the odometry here
#     is Point-LIO-corrected and accurate between scans. Measured 2026-10-17, replay of bench_walk_1 on maps/lab_dense
#     (built from the other walk), AMCL vs our mapping pose: median 26 -> 17 cm, worst 4.7 m -> 0.46 m, heading worst
#     121 -> 9.8 deg, time > 30 cm off 41 % -> 5 % (beam skip / z_hit 0.9 did not help further).
#   2026-10-17, after the first live runs (ghost "particles", slow turns):
#   costmaps + collision monitor read /scan_nav (0.15-0.70 m, see pointcloud_to_laserscan.yaml) with inf_is_valid true:
#     the local costmap had inf_is_valid false, so open directions never cleared and every stray point stayed marked
#   controller (RPP): rotate_to_heading_angular_vel 0.4 -> 0.6, min_approach / regulated min speed 0.12 / 0.10 -> 0.15
#     (the Go2's gait barely responds near zero), lookahead 0.4 (0.3-0.6) -> 0.6 (0.4-0.9) m for smoother legged paths,
#     desired_linear_vel 0.25 -> 0.28; velocity_smoother angular limit 0.5 -> 0.7 rad/s (bridge cap 0.7 too)
#   2026-10-17, operator request: cruise 0.5 m/s, slowest 0.28 m/s (RPP desired_linear_vel 0.5, min_approach /
#     regulated min speed 0.28), on-the-spot turn 1.0 rad/s, look-ahead scaled with speed (1.5 s, 0.5-1.2 m);
#     velocity_smoother caps 0.55 m/s / 1.1 rad/s, accel 0.6 m/s2 / 1.2 rad/s2, decel 0.9 m/s2 / 1.6 rad/s2 (start/stop
#     times about as before); go2_cmd_bridge caps 0.55 m/s / 1.1 rad/s
#   2026-10-17, live: robot did not turn. RPP limits its turn rate to (MEASURED rate + max_angular_accel / 20 Hz); the Go2
#     does not turn below its gait's dead zone, so the measured rate stayed 0 and RPP stayed at 3.2 / 20 = 0.16 rad/s.
#     max_angular_accel 3.2 -> 20 (the velocity_smoother's 1.2 rad/s2 still limits real acceleration).
#   2026-10-17, live (operator): global inflation too wide, robot touching obstacles. global inflation 1.0 m / scaling 2.0
#     -> 0.55 m / 3.0 (doorways and corridors usable); local 0.70 -> 0.85 m; footprint_padding 0.05 m in both (legs
#     swing beyond the body outline); raytrace_min_range 1.0 m: near_crop drops points 0.55-0.95 m ahead, so with clearing
#     on, rays to the wall behind an obstacle that came that close erased it from the costmap just before contact.
#   2026-10-17, operator: inflation and footprint margin back to the SIM's values (local 0.70 m / scaling 3.0, global
#     1.0 m / 2.0, no footprint_padding). Kept from the real-robot fixes: /scan_nav, inf_is_valid, raytrace_min_range 1.0.
#   2026-10-18, AMCL went haywire where objects not in the map (cardboard) hid the walls: localization_guard (section
#     below, launch guard:=full, the default) publishes map -> odom instead of AMCL (amcl tf_broadcast is set false by the
#     launch). It follows AMCL within a drift budget, ignores AMCL jumps and re-seeds AMCL. Replays of cardboard_walk_1 on
#     maps/lab_dense (no cardboard in it), 2 runs each, vs the Point-LIO path: median 0.44 -> 0.13 m, worst 5.1 -> 0.5 m,
#     time > 0.5 m off 47 -> 0.1 %, in the cardboard stretches 88 -> 0 %; bench_walk_1 (no clutter) 0.16 -> 0.13 m. No AMCL
#     setting alone helped (beam skip, z mix, update rate, recovery alphas, particles, alpha 0.1, sigma_hit).
# Footprint (0.74 x 0.35 m) and inflation are the sim's; speeds and controller limits as listed above.
amcl:
  ros__parameters:
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 15.0
    laser_min_range: 0.8
    laser_model_type: likelihood_field
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
localization_guard:
  ros__parameters:
    # Drift budget: how fast map -> odom may follow AMCL. Point-LIO's true drift: p95 3.5 cm/s, 0.16 deg/s.
    follow_v: 0.02
    follow_w_deg: 0.2
    # For 20 s after a start pose / "2D Pose Estimate" the budget is 0.10 m/s, 1 deg/s: a pose up to ~0.5 m / 10 deg off is
    # corrected; 1 m / 20 deg is not.
    settle_s: 20.0
    settle_v: 0.10
    settle_w_deg: 1.0
    # AMCL further than this from the held pose is not followed; after reseed_after_s it is re-seeded to the held pose.
    diverge_dist: 0.6
    diverge_yaw_deg: 8.0
    reseed_after_s: 3.0
    reseed_cooldown_s: 3.0
    # Big corrections from the scan score are off: in the lab a wrong pose often matches the map as well as the right one.
    big_corrections: "off"
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /go2/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: 'nav2_bt_navigator::NavigateToPoseNavigator'}
    navigate_through_poses: {plugin: 'nav2_bt_navigator::NavigateThroughPosesNavigator'}
    error_code_names: [compute_path_error_code, follow_path_error_code]
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.5, movement_time_allowance: 20.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 0.25, yaw_goal_tolerance: 0.25}
    FollowPath: {plugin: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController', desired_linear_vel: 0.5,
      lookahead_dist: 0.75, min_lookahead_dist: 0.5, max_lookahead_dist: 1.2, lookahead_time: 1.5, use_velocity_scaled_lookahead_dist: true,
      rotate_to_heading_angular_vel: 1.0, use_rotate_to_heading: true, rotate_to_heading_min_angle: 0.5, max_angular_accel: 20.0,
      allow_reversing: false, transform_tolerance: 0.3, min_approach_linear_velocity: 0.28, approach_velocity_scaling_dist: 0.3,
      use_collision_detection: true, max_allowed_time_to_collision_up_to_carrot: 1.0, use_regulated_linear_velocity_scaling: true,
      regulated_linear_scaling_min_radius: 1.5, regulated_linear_scaling_min_speed: 0.28, use_cost_regulated_linear_velocity_scaling: true,
      cost_scaling_dist: 0.6, cost_scaling_gain: 1.0, inflation_cost_scaling_factor: 3.0, use_fixed_curvature_lookahead: false,
      curvature_lookahead_dist: 0.6, max_robot_pose_search_dist: 10.0, interpolate_curvature_after_goal: false}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[0.37, 0.175], [0.37, -0.175], [-0.37, -0.175], [-0.37, 0.175]]'
      plugins: [static_layer, obstacle_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 3.0, inflation_radius: 0.7}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan_nav, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 5.0,
          raytrace_min_range: 1.0, obstacle_max_range: 4.0, obstacle_min_range: 0.0, inf_is_valid: true}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: '[[0.37, 0.175], [0.37, -0.175], [-0.37, -0.175], [-0.37, 0.175]]'
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan_nav, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, inf_is_valid: true,
          raytrace_max_range: 5.0, raytrace_min_range: 1.0, obstacle_max_range: 3.0, obstacle_min_range: 0.0}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 2.0, inflation_radius: 1.0}
      always_send_full_costmap: true
map_saver:
  ros__parameters: {save_map_timeout: 5.0, free_thresh_default: 0.25, occupied_thresh_default: 0.65, map_subscribe_transient_local: true}
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 6.0
      use_final_approach_orientation: false
      smoother: {max_iterations: 1000, w_smooth: 0.3, w_data: 0.2, tolerance: 1.0e-10}
smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: 'nav2_smoother::SimpleSmoother', tolerance: 1.0e-10, max_its: 1000, do_refinement: true}
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin: {plugin: 'nav2_behaviors::Spin'}
    backup: {plugin: 'nav2_behaviors::BackUp'}
    drive_on_heading: {plugin: 'nav2_behaviors::DriveOnHeading'}
    wait: {plugin: 'nav2_behaviors::Wait'}
    assisted_teleop: {plugin: 'nav2_behaviors::AssistedTeleop'}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true, waypoint_pause_duration: 200}
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.55, 0.25, 1.1]
    min_velocity: [-0.2, -0.25, -1.1]
    max_accel: [0.6, 0.4, 1.2]
    max_decel: [-0.9, -0.6, -1.6]
    odom_topic: /go2/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /go2/nav2_cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint, time_before_collision: 1.2,
      simulation_time_step: 0.1, min_points: 6, visualize: false, enabled: true}
    observation_sources: [scan]
    scan: {type: scan, topic: /scan_nav, min_height: 0.15, max_height: 2.0, enabled: true}
