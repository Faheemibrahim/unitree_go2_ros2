# REAL ROBOT copy of unitree_go2_navigation/config/pointcloud_to_laserscan.yaml (sim file untouched).
# Changed: use_sim_time false (PC clock; real_tf_bridge.py restamps the robot's data).
# Sim-tuned values below are NOT yet checked on the real robot; comments are the sim's.

# Lidar cloud to 2D /scan (launch/scan.launch.py). The L1 under the chin sees only
# the half-sphere below its mounting face, tilted 15 deg forward
# (docs/L1_LIDAR_REALISM.md section 5): ahead it reaches 15 deg above horizontal, to
# the sides only level, and behind it looks at least 15 deg down. So walls show up
# in a 2D scan only in a thin band around the lidar's own height.

# Removes the robot's own legs, which the L1 sees just as the real one does. The box
# is in base_link. Measured in sim standing and walking at 0.25 m/s, leg returns lie
# within x 0.05..0.26, |y| <= 0.175, z -0.20..-0.13 (nav_test_tools/lidar_body.py);
# the hind legs are outside the field of view. Margins of ~5-7 cm, and the box stops
# short of the footprint's front edge (0.37) so a wall the nose nearly touches stays
# visible. Re-check against a real bag: the real robot stands taller.
# The input is in odom; each cloud is cropped in base_link at its own stamp, then put
# back in odom for merging.
body_crop:
  ros__parameters:
    use_sim_time: false
    input_frame: base_link
    output_frame: odom
    negative: true            # drop the points inside the box, keep the rest
    # Real Go2, measured on lab_walk_1 (scripts/cloud_profile.py): in the scan band the
    # body-fixed returns are two blobs at base_link x +0.1..+0.5, y -0.55..-0.3 and
    # +0.25..+0.5 (about 2 points per cloud per cell, same place in every cloud), at
    # 0.08-0.3 m above the floor; nothing inside |y| < 0.22. The sim's box (|y| < 0.22)
    # missed them and they showed as a ring around the path in the 2D scan.
    min_x: -0.15
    max_x: 0.55
    min_y: -0.55
    max_y: 0.50
    min_z: -0.40
    max_z: 0.20

# The L1's near-field artifact ahead of the head ("ghost obstacles" in Nav2's costmap). Measured 2026-10-17, live and on a
# replay of lab_map_lio_f (nav_test_tools/ghost_live.py, ghost_offline.py, nearfield_check.py): while walking, points
# 0.6-0.8 m ahead of the body centre, about 0.25 m above the floor, that move WITH the robot (same robot-frame spot while
# walking and turning: not in the room); raw range from the lidar 0.35-0.65 m (5-95 %), normal intensity. 5.4 % of the
# points near the robot while walking were such ghosts (0.4 % standing). Unitree's own clouds keep them. This box removes
# that zone: a real object closer than ~0.6 m in front of the nose is not in the 2D scan at that moment (it was seen
# from further away and stays in the costmap).
near_crop:
  ros__parameters:
    use_sim_time: false
    input_frame: base_link
    output_frame: odom
    negative: true
    min_x: 0.55
    max_x: 0.95
    min_y: -0.50
    max_y: 0.50
    min_z: -0.40
    max_z: 0.15
    keep_organized: false

# The scan band, applied to the cloud before it is merged (launch: body_crop -> band ->
# cloud_accumulator). Same heights as pointcloud_to_laserscan below; z in odom is height
# above the floor (odom z origin = floor, measured on lab_walk_1).
band:
  ros__parameters:
    use_sim_time: false
    filter_field_name: z
    filter_limit_min: 0.08
    filter_limit_max: 2.5
    filter_limit_negative: false
    keep_organized: false

# One L1 message (~1,400 points, 12 sweeps) leaves 4-22 deg gaps in azimuth; ~0.3 s
# (about 5 messages, 60 sweeps) fills them to a few degrees. Go2 users buffer the same
# (docs/L1_LIDAR_REALISM.md sections 4.3 and 7). Longer smears moving obstacles.
cloud_accumulator:
  ros__parameters:
    # Works from message stamps only; subscribing to the sim clock (~1 kHz) cost
    # half a core in rclpy for nothing.
    use_sim_time: false
    # 0.5 s: best of 0 / 0.1 / 0.2 / 0.3 / 0.5 / 1.0 s in the 2026-10-16 sweep (each against the plain baseline,
    # 3 runs x 2 tuning bags, error at the stops against the walls; score 0.16 = about 1/6 of the baseline's
    # error, 6/6 runs better than the baseline's middle run), and held on the held-out bag.
    window_s: 0.5

pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: false

    # Gravity-aligned ground frame, so the band means height above the floor.
    target_frame: base_footprint
    transform_tolerance: 0.1

    # A band from 10 cm above the floor to 5 cm above the lidar. Measured standing in
    # this frame: floor -0.02, lidar 0.13 (nav_test_tools/lidar_check.py). Above the
    # lidar only a forward wedge has data, and the lower edge keeps floor returns out
    # (+-1 cm noise plus body pitch while walking). Both edges follow the lidar
    # height: when the sim robot is raised to the real standing height, move them up
    # by the same amount.
    #
    # Top edge: 2.5 m, not "lidar height + 5 cm". The forward fan sees far walls well
    # above the lidar (15 deg up: 1.4 m high at 5 m ahead) and walls are vertical, so
    # those points belong on the same wall line. Replaying one recorded mapping drive
    # (nav_test_tools/replay_map.sh, 1x): band to 0.18 m: map precision 62% / recall 52%;
    # band to 2.5 m: 73% / 65% at 10 m range, 82% / 70% at 15 m.
    min_height: 0.08
    max_height: 2.5

    # 1 deg bins. One scan per lidar message (~15 Hz), each from the last 0.3 s.
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.01745
    scan_time: 0.0667

    # Distances are horizontal, from base_footprint. The crop box already removed the
    # body. The cap exists because floor returns drift into the band as a tilt error
    # grows with distance: at 10 m the tilt error (0.2-0.35 deg, rarely 1.7) lifts
    # them 3-6 cm (rarely 30 cm) against a 10 cm margin. Measured in a corridor
    # (nav_test_tools/lidar_scan_check.py), walking at 0.25 m/s: 5 m cap 0.03% of scan
    # points more than 0.15 m from any wall, 10 m cap 0.27%. At 15 m the check itself
    # cannot tell leakage from ground-truth pose error. A 5 m cap also hid every
    # wall farther than 5 m straight ahead (flat walls 4.3 m ahead lost the outer
    # 24% of bearings, since their range at 30 deg exceeds 5 m).
    # Replay, band to 2.5 m: 10 m range 73% / 65% map precision / recall, 15 m 82% / 70%,
    # 20 m 36% / 32% (2x replay; slam_toolbox drops scans under load, +-6 points).
    # Far corridor ends and junctions are what pin the position; floor leakage is the
    # price (tilt error 0.3 deg is 8 cm at 15 m against the 8 cm floor margin).
    range_min: 0.1
    range_max: 15.0

    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10

# Second scan, for Nav2's costmaps and collision monitor only (/scan_nav; /scan above stays as it is, for AMCL).
# 2026-10-17, live: ghost "particles" in the local costmap. After near_crop the remaining ghosts were floor-level specks
# (median 0.09 m, just above /scan's 0.08 m edge; replay of lab_map_lio_f, nav_test_tools/ghost_offline.py). Obstacles
# for a Go2 start at 0.15 m (lower things it can step over or the floor), and nothing above 0.7 m touches the robot
# (body top ~0.45 m, table tops are passed under). Short range: costmap marking only needs the near field.
pointcloud_to_laserscan_nav:
  ros__parameters:
    use_sim_time: false
    target_frame: base_footprint
    transform_tolerance: 0.1
    min_height: 0.15
    max_height: 0.70
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.01745
    scan_time: 0.0667
    range_min: 0.1
    range_max: 5.0
    use_inf: true            # no return -> inf: the costmap clears along that whole ray (inf_is_valid)
    inf_epsilon: 1.0
    queue_size: 10
