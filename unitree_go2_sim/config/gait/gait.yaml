/**:
  ros__parameters:
    gait:
      knee_orientation : ">>"
      pantograph_leg : false
      # Calibrated against /odom/ground_truth in the open default world: at 0.9
      # the leg odometry reported only ~68% of the distance walked (CHAMP zeroes
      # velocity whenever all four feet are down), which made AMCL fall behind
      # and lose the robot in the maze. 0.9 / 0.68 = 1.32.
      odom_scaler: 1.32
      max_linear_velocity_x : 0.3
      max_linear_velocity_y : 0.25
      max_angular_velocity_z : 0.5
      com_x_translation: 0.0
      swing_height : 0.04
      stance_depth : 0.01
      stance_duration : 0.25
      nominal_height : 0.225
